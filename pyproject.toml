[project]
name = "finbench"
version = "0.1.0"
description = "Tool-use evaluation of small LLMs on FinQA (FinTune-Sentinel stage 1)"
requires-python = ">=3.11"
dependencies = ["openai>=1.40"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["finbench", "sentinel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
addopts = "-q"

[tool.coverage.run]
source = ["finbench", "sentinel"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
